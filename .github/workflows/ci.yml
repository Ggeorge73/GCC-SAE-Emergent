name: Portfolio CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build and browser tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Build production frontend
        run: npm run build
        env:
          CI: true
          GENERATE_SOURCEMAP: false
          PUBLIC_URL: /${{ github.event.repository.name }}
          REACT_APP_BACKEND_URL: http://127.0.0.1:8001
      - name: Test review state and export rules
        run: npm test -- --watchAll=false --runInBand
        env:
          CI: true
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Law Suite browser tests
        run: npm run test:e2e
        env:
          CI: true
      - name: Upload browser-test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - name: Install API dependencies for signed-in journeys
        working-directory: .
        run: python -m pip install --disable-pip-version-check -r backend/requirements-ci.txt
      - name: Run signed-in browser journeys against a live API
        run: npm run test:e2e:server
        env:
          CI: true
          PYTHON: python
      - name: Upload signed-in browser-test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-server
          path: frontend/playwright-report-server/
          retention-days: 14

  backend:
    name: Backend integration tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - name: Install API test dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements-ci.txt
      - name: Compile backend sources
        run: python -m py_compile backend/server.py backend_test.py
      - name: Run research safety tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Verify interrupted initialization on disposable MongoDB
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: law_suite_ci_${{ github.run_id }}_${{ github.run_attempt }}_recovery
          RUN_MONGO_RECOVERY_TESTS: "true"
        run: python -m unittest tests.test_real_mongo_recovery
      - name: Run existing API integration journeys
        env:
          MONGO_URL: mongodb://127.0.0.1:27017
          DB_NAME: law_suite_ci_${{ github.run_id }}_${{ github.run_attempt }}
          CORS_ORIGINS: http://127.0.0.1:4173
          LAW_SUITE_AI_MODE: offline
          LAW_SUITE_ALLOW_LOCAL_DEMO: "true"
          LAW_SUITE_API_URL: http://127.0.0.1:8001/api
          RUN_LIVE_AI_TESTS: false
        run: |
          uvicorn backend.server:app --host 127.0.0.1 --port 8001 > /tmp/law-suite-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8001/api/ > /dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl --fail --silent http://127.0.0.1:8001/api/ > /dev/null; then
            cat /tmp/law-suite-api.log
            exit 1
          fi

          python backend_test.py

  pages-build:
    name: Build verified Pages artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Build portfolio
        working-directory: frontend
        run: npm run build
        env:
          CI: true
          GENERATE_SOURCEMAP: false
          PUBLIC_URL: /${{ github.event.repository.name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/build

  pages-deploy:
    name: Deploy verified GitHub Pages build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
